<!-- =========================================================
     ETHICS SECURITY SERVICE
     GALLERY - CLEAN FINAL
========================================================= -->


<!-- =========================================================
     HERO
========================================================= -->

<section class="ess-gallery-clean-hero">

  <div class="ess-gallery-clean-hero-inner">

    <span class="ess-gallery-clean-eyebrow">
      PHOTO GALLERY
    </span>

    <h1>
      Our people.
      <strong>Our work in the field.</strong>
    </h1>

    <p>
      Photos from security operations, personnel,
      training, industrial assignments and events.
    </p>

  </div>

</section>



<!-- =========================================================
     GALLERY
========================================================= -->

<section class="ess-gallery-clean-section">

  <div class="ess-gallery-clean-body-wrap">


    <!-- GALLERY HEADER -->

    <header class="ess-gallery-clean-head">

      <div>

        <span>
          FIELD OPERATIONS
        </span>

        <h2>
          Ethics Security Service
          <strong>in action.</strong>
        </h2>

      </div>


      <div class="ess-gallery-clean-count">

        <strong id="essGalleryCount">
          —
        </strong>

        <span>
          Photos
        </span>

      </div>

    </header>



    <!-- FILTER TOOLBAR -->

    <div class="ess-gallery-clean-toolbar">

      <div
        class="ess-gallery-clean-filters"
        id="essGalleryFilters"
        role="group"
        aria-label="Filter gallery photos"
      >

        <button
          class="is-active"
          data-filter="all"
          type="button"
        >
          All Photos
        </button>

      </div>

    </div>



    <!-- PHOTO GRID -->

    <div
      class="ess-gallery-clean-grid"
      id="essGalleryGrid"
      aria-live="polite"
    >

      <div class="ess-gallery-clean-loading">

        <i class="fa fa-picture-o"></i>

        <span>
          Loading gallery...
        </span>

      </div>

    </div>



    <!-- EMPTY -->

    <div
      class="ess-gallery-clean-empty"
      id="essGalleryEmpty"
      hidden
    >

      <i class="fa fa-picture-o"></i>

      <strong>
        No photos available.
      </strong>

      <p>
        Please select another category.
      </p>

    </div>


  </div>

</section>



<!-- =========================================================
     LIGHTBOX
========================================================= -->

<div
  class="ess-gallery-clean-lightbox"
  id="essGalleryLightbox"
  aria-hidden="true"
>

  <div
    class="ess-gallery-clean-lightbox-backdrop"
    data-gallery-close
  ></div>


  <div
    class="ess-gallery-clean-lightbox-shell"
    role="dialog"
    aria-modal="true"
    aria-labelledby="essGalleryLightboxTitle"
  >


    <header class="ess-gallery-clean-lightbox-head">

      <div>

        <span id="essGalleryLightboxCategory">
          GALLERY
        </span>

        <strong id="essGalleryLightboxTitle">
          Photo
        </strong>

      </div>


      <div class="ess-gallery-clean-lightbox-position">

        <span id="essGalleryLightboxPosition">
          1 / 1
        </span>

      </div>


      <button
        type="button"
        data-gallery-close
        aria-label="Close photo viewer"
      >
        <i class="fa fa-times"></i>
      </button>

    </header>



    <div class="ess-gallery-clean-lightbox-image">

      <img
        id="essGalleryLightboxImage"
        src=""
        alt=""
      >

    </div>



    <button
      type="button"
      class="ess-gallery-clean-prev"
      id="essGalleryPrev"
      aria-label="Previous photo"
    >
      <i class="fa fa-angle-left"></i>
    </button>


    <button
      type="button"
      class="ess-gallery-clean-next"
      id="essGalleryNext"
      aria-label="Next photo"
    >
      <i class="fa fa-angle-right"></i>
    </button>


  </div>

</div>
